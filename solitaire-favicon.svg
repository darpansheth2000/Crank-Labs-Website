<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <rect width="100" height="100" fill="#0D0A08"/>
  <g fill="none" stroke="#D9B36C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <!-- table -->
    <line x1="36" y1="27" x2="64" y2="27"/>
    <!-- crown outer left / right -->
    <line x1="15" y1="43" x2="36" y2="27"/>
    <line x1="64" y1="27" x2="85" y2="43"/>
    <!-- girdle -->
    <line x1="15" y1="43" x2="85" y2="43"/>
    <!-- pavilion to culet -->
    <line x1="15" y1="43" x2="50" y2="79"/>
    <line x1="85" y1="43" x2="50" y2="79"/>
    <!-- crown facets -->
    <line x1="36" y1="27" x2="28" y2="43"/>
    <line x1="64" y1="27" x2="72" y2="43"/>
    <line x1="36" y1="27" x2="50" y2="43"/>
    <line x1="64" y1="27" x2="50" y2="43"/>
    <line x1="50" y1="27" x2="50" y2="43"/>
    <!-- pavilion facets -->
    <line x1="28" y1="43" x2="50" y2="79"/>
    <line x1="50" y1="43" x2="50" y2="79"/>
    <line x1="72" y1="43" x2="50" y2="79"/>
  </g>
</svg>
